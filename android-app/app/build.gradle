plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
android {
    namespace 'com.telesales.status'
    compileSdk 34
    defaultConfig {
        applicationId 'com.telesales.status'
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName '3.5'
    }
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug; minifyEnabled false }
        release { signingConfig signingConfigs.debug; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.gms:play-services-auth:21.0.0'
}
