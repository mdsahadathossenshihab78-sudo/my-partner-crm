plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
android {
    namespace 'com.telesales.status'
    compileSdk 34
    defaultConfig {
        applicationId 'com.telesales.status'
        minSdk 24
        targetSdk 34
        versionCode 46
        versionName '4.32'
    }
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file(System.getenv('RELEASE_STORE_FILE') ?: 'release.keystore')
            storePassword System.getenv('RELEASE_STORE_PASSWORD')
            keyAlias System.getenv('RELEASE_KEY_ALIAS')
            keyPassword System.getenv('RELEASE_KEY_PASSWORD')
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug; minifyEnabled false }
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.gms:play-services-auth:21.0.0'
    implementation 'androidx.browser:browser:1.7.0'
    implementation 'androidx.work:work-runtime:2.9.0'
}
